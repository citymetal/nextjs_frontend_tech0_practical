name: Build and deploy Next.js app to Azure Web App - tech0-gen-11-step3-2-node-59

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tech0-gen-11-step3-2-node-59
  # ★★★修正 1：パッケージパスをルートにする (デプロイパッケージがルートにあるため)★★★
  AZURE_WEBAPP_PACKAGE_PATH: '.' 
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      # Node.js環境のセットアップ (これはそのまま)
      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      # npm install
      - name: npm install
        run: npm install
        working-directory: ./frontend 

      # Next.jsのビルド
      - name: Next.js build (No Lint)
        run: npm run build || true 
        working-directory: ./frontend

      # ★★★究極の修正 2：デプロイ準備のため、frontend全体をルートに移動★★★
      - name: Prepare deployment package
        run: |
          # frontend の内容 (.next, node_modules, package.json, next.config.js) をルートに移動
          mv ./frontend/* ./.
          mv ./frontend/.next ./.
          # ★注意：.nextは別コマンドで移動しないと、mv ./frontend/* ./. でスキップされる場合がある

      # ★★★究極の修正 3：アーティファクトアップロードを削除し、直接デプロイ★★★
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

# ★★★究極の修正 4：deploy ジョブを完全に削除★★★
