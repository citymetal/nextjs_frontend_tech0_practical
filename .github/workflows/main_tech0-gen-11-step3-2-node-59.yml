name: Build and deploy Next.js app to Azure Web App - tech0-gen-11-step3-2-node-59

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tech0-gen-11-step3-2-node-59
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm install
        run: npm install
        working-directory: ./frontend 

      - name: Next.js build (No Lint)
        run: npm run build || true 
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_ENDPOINT: https://tech0-gen-11-step3-2-py-59.azurewebsites.net        

      - name: Create Deployment Package
        run: |
          mkdir -p deploy_package
          # ★修正ポイント：ビルド済みの .next に加え、ソースコード本体もコピーする
          cp -r ./frontend/.next ./deploy_package/
          cp -r ./frontend/public ./deploy_package/ 2>/dev/null || true
          # src フォルダや app フォルダがある場合、それらもコピーに含める
          cp -r ./frontend/src ./deploy_package/ 2>/dev/null || true
          cp -r ./frontend/app ./deploy_package/ 2>/dev/null || true
          cp ./frontend/package.json ./deploy_package/
          cp ./frontend/package-lock.json ./deploy_package/
          cp ./frontend/next.config.js ./deploy_package/
          
          cd deploy_package
          zip -r ../app.zip .
          cd ..

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app-zip
          path: ./app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app-zip
          path: .  # ★現在のディレクトリに展開するように指定

      - name: Unzip deployment package
        run: unzip app.zip

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3 
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: . 
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D939D61B8137457EBCA6E559E44599F2 }}
