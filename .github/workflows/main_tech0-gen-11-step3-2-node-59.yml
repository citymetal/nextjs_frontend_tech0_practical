name: Build and deploy Next.js app to Azure Web App - tech0-gen-11-step3-2-node-59

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tech0-gen-11-step3-2-node-59
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm install
        run: npm install
        working-directory: ./frontend 

      - name: Next.js build
        run: npm run build
        working-directory: ./frontend
        env:
          # ビルド時にバックエンドの接続先を固定します
          NEXT_PUBLIC_API_ENDPOINT: https://tech0-gen-11-step3-2-py-59.azurewebsites.net        

      - name: Create Deployment Package
        run: |
          # 1. デプロイ用の作業ディレクトリ作成
          mkdir -p deploy_package
          
          # 2. スタンドアロン出力された実行ファイルをルートにコピー
          # (image_94ac45.png の設定により生成された成果物を使用)
          cp -r ./frontend/.next/standalone/. ./deploy_package/
          
          # 3. ★重要★ 404エラーを防ぐため、静的ファイルを正しい位置に配置
          # ブラウザが参照する .next/static フォルダを手動で作成・コピーします
          mkdir -p deploy_package/.next/static
          cp -r ./frontend/.next/static/. ./deploy_package/.next/static/
          cp -r ./frontend/public/. ./deploy_package/public/ 2>/dev/null || true
          
          # 4. ZIP化
          cd deploy_package
          zip -r ../app.zip .
          cd ..

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app-zip
          path: ./app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app-zip
          path: .

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3 
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_D939D61B8137457EBCA6E559E44599F2 }}
          package: ./app.zip
