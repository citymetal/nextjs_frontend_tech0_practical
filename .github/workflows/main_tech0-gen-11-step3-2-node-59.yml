name: Build and deploy Next.js app to Azure Web App - tech0-gen-11-step3-2-node-59

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tech0-gen-11-step3-2-node-59
  AZURE_WEBAPP_PACKAGE_PATH: '.' 
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      # Node.js環境のセットアップ
      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      # npm install
      - name: npm install
        run: npm install
        working-directory: ./frontend 

      # Next.jsのビルド
      - name: Next.js build (No Lint)
        run: npm run build || true 
        working-directory: ./frontend

      # ★★★修正 1：ビルド成果物 (.next) をリポジトリルートに移動★★★
      - name: Move .next to Root for Artifact Upload
        run: mv ./frontend/.next ./.next
        
      # ★★★修正 2：node_modules をアップロードに含める (Publish Profileが認識できるよう)★★★
      - name: Move node_modules to Root for Deployment
        run: mv ./frontend/node_modules ./.
        
      # ★★★修正 3：package.json などルートに必要なファイルも移動★★★
      - name: Move Root Files
        run: |
          mv ./frontend/package.json ./.
          mv ./frontend/next.config.js ./.

      # ★★★修正 4：アーティファクトのアップロード (ビルドのみを目的とする)★★★
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./.next 
          
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          
      # ★★★修正 5：デプロイパッケージの準備（ダウンロードした.nextとローカルの他のファイルを使用）★★★
      - name: Prepare deployment directory
        run: |
          # ダウンロードした.nextフォルダをデプロイに必要な場所に配置する
          mv ./node-app ./.next
          
      # ★★★修正 6：Azure Web Appへのデプロイ（Publish Profileに依存）★★★
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: . # ルートに.nextとnode_modules、package.jsonがあるため
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
