name: Build and deploy Next.js app to Azure Web App - tech0-gen-11-step3-2-node-59

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tech0-gen-11-step3-2-node-59
  AZURE_WEBAPP_PACKAGE_PATH: '.'
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      # Node.js環境のセットアップ (キャッシュなし)
      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      # ★★★最終修正：インストール、ビルド、コピーを一つのステップに統合★★★
      - name: Install, Build, and Prepare Artifact
        run: |
          # 1. frontend ディレクトリに移動し、以降のコマンドの作業ディレクトリを固定
          echo "Moving to frontend directory..."
          cd ./frontend
          
          # 2. 依存関係のインストール
          echo "Installing npm dependencies..."
          npm install

          # 3. Next.jsのビルド (エラーは無視し、確実にビルドを完了させる)
          echo "Starting Next.js build..."
          npm run build || true 

          # 4. Standaloneに必要な依存関係のコピー
          # ./frontend フォルダ内にいるため、相対パスは ./.next/standalone/ となる
          echo "Copying dependencies to standalone directory..."
          mkdir -p ./.next/standalone/node_modules 
          cp -r ./node_modules/* ./.next/standalone/node_modules/ || true 

      # アーティファクトのアップロードステップ (これはそのまま)
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./frontend/.next 

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          
      # Azure Web Appへのデプロイ
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
