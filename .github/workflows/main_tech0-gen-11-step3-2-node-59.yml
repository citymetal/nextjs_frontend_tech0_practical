jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      # Node.js環境のセットアップ (これはそのまま)
      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      # ★★★最終修正 1：ビルド処理をrsyncに置き換え、パスをリポジトリルートに同期★★★
      - name: Install, Build, and Prepare Artifact
        run: |
          # 1. frontend ディレクトリに移動し、作業ディレクトリを固定
          echo "Moving to frontend directory..."
          cd ./frontend
          
          # 2. 依存関係のインストール
          echo "Installing npm dependencies..."
          npm install

          # 3. Next.jsのビルド (エラーは無視)
          echo "Starting Next.js build..."
          npm run build || true 

          # 4. Standaloneに必要な依存関係のコピー
          echo "Copying dependencies to standalone directory..."
          mkdir -p ./.next/standalone/node_modules 
          cp -r ./node_modules/* ./.next/standalone/node_modules/ || true 
          
          # ★★★最終修正：ビルド成果物 (.next) をリポジトリルートに確実に同期★★★
          # .next フォルダ全体をリポジトリルートに同期（コピー）する
          echo "Syncing .next to repository root using rsync..."
          rsync -avz ./.next ../

      # アーティファクトのアップロードステップ
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # ★★★修正 2：アップロードパスをリポジトリルートの.nextに修正★★★
          path: ./.next 

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          
      # Azure Web Appへのデプロイ
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
