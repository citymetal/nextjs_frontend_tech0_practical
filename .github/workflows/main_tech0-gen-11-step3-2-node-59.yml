jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      # ... (中略：Set up Node.js version) ...
          
      # インストール、ビルド、コピーを一つのステップに統合 (中略)
      - name: Install, Build, and Prepare Artifact
        run: |
          # 1. frontend ディレクトリに移動し、作業ディレクトリを固定
          cd ./frontend
          
          # 2. 依存関係のインストール (npm install)
          npm install

          # 3. Next.jsのビルド (npm run build || true)
          npm run build || true 

          # 4. Standaloneに必要な依存関係のコピー (cp -r ...)
          mkdir -p ./.next/standalone/node_modules 
          cp -r ./node_modules/* ./.next/standalone/node_modules/ || true 

          # ★★★最終修正 1：ビルド成果物をリポジトリルートに移動★★★
          echo "Moving ./.next to repository root..."
          mv ./.next ../.next 

      # アーティファクトのアップロードステップ
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # ★★★最終修正 2：アップロードパスをリポジトリルートの.nextに修正★★★
          path: ./.next 

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          
      # Azure Web Appへのデプロイ
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          # ★★★最終修正 3：デプロイされるファイルはルートに移動した.nextフォルダ★★★
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
