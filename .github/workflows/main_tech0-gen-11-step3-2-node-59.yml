jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      # Node.js環境のセットアップ (これはそのまま)
      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      # ★★★究極の修正：全処理を統合し、ビルド成果物をルートに確実に配置★★★
      - name: Install, Build, and Prepare Artifact
        run: |
          # 1. frontend ディレクトリに移動し、作業ディレクトリを固定
          echo "Moving to frontend directory..."
          cd ./frontend
          
          # 2. 依存関係のインストール
          echo "Installing npm dependencies..."
          npm install

          # 3. Next.jsのビルド (エラーは無視)
          echo "Starting Next.js build..."
          npm run build || true 

          # 4. Standaloneに必要な依存関係のコピー（rsyncでnode_modules全体をコピー）
          echo "Copying dependencies to standalone directory..."
          mkdir -p ./.next/standalone/node_modules 
          # cp -r の代わりに rsync を使用してファイルシステムの不整合を回避
          rsync -avz ./node_modules/ ./.next/standalone/node_modules/ || true 
          
          # 5. ビルド成果物 (.next) をリポジトリルートに確実に同期
          echo "Syncing .next to repository root using rsync..."
          # .next フォルダ全体をリポジトリルート (一つ上のディレクトリ ../) に同期
          rsync -avz ./.next ../

      # アーティファクトのアップロードステップ
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./.next # リポジトリルートに同期された .next を指定
# ... (deploy ジョブは省略) ...
