name: Build and deploy Next.js app to Azure Web App - tech0-gen-11-step3-2-node-59

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tech0-gen-11-step3-2-node-59    # 設定したWeb App名
  AZURE_WEBAPP_PACKAGE_PATH: '.'                 # デプロイパッケージのパス
  NODE_VERSION: '20.x'                           # Node.js バージョン

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend            # ★作業ディレクトリをfrontendに指定

    steps:
      - uses: actions/checkout@v4
      
      # Node.js環境のセットアップ
      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json' # ★frontend内の依存ファイルを参照
      
      # 依存関係のインストール
      - name: npm install
        run: npm install

      # Next.jsのビルド実行 (standalone出力)
      - name: npm run build
        run: npm run build

      # ★★★修正箇所★★★
      # デプロイ成果物のアップロード (server.jsと実行に必要なファイルをすべて含む.nextフォルダ全体)
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # Next.jsの実行に必要な.nextフォルダ全体をデプロイ対象とする
          path: ./frontend/.next 

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          
      # Azure Web Appへのデプロイ
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          # デプロイファイルをそのままWeb Appのルートに展開
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
