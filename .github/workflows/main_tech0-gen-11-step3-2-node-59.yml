name: Build and deploy Next.js app to Azure Web App - tech0-gen-11-step3-2-node-59

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tech0-gen-11-step3-2-node-59
  AZURE_WEBAPP_PACKAGE_PATH: '.'
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      # Node.js環境のセットアップ (キャッシュなし)
      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      # npm install の実行 (シェル内でcdを強制)
      - name: npm install
        run: cd ./frontend && npm install

      # npm run buildの実行 (シェル内でcdを強制)
      - name: npm run build
        run: cd ./frontend && npm run build

      # ★★★最終修正：依存関係をビルドフォルダにコピーし、成果物としてアップロード★★★
      - name: Copy dependencies and Upload artifact for deployment
        run: |
          # Next.jsのStandaloneに必要な依存関係を強制的にコピー
          mkdir -p ./frontend/.next/standalone/node_modules 
          cp -r ./frontend/node_modules/* ./frontend/.next/standalone/node_modules/
        
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./frontend/.next 

  deploy:
    # ... (後略) ...
