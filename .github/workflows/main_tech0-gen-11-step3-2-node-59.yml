name: Build and deploy Next.js app to Azure Web App - tech0-gen-11-step3-2-node-59

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tech0-gen-11-step3-2-node-59
  AZURE_WEBAPP_PACKAGE_PATH: '.'
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest
    # ★★★修正 1：defaultsを完全に削除★★★

    steps:
      - uses: actions/checkout@v4
      
      # Node.js環境のセットアップ (キャッシュなし)
      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      # ★★★修正 2：npm install の実行 (prefixでパスを強制)★★★
      - name: npm install
        run: npm install --prefix ./frontend 

      # ★★★修正 3：npm run buildの実行 (prefixでパスを強制)★★★
      - name: npm run build
        run: npm run build --prefix ./frontend 

      # ★★★修正 4：依存関係コピーのステップ (パスをルート基準に修正)★★★
      - name: Copy necessary dependencies to standalone directory
        run: |
          # リポジトリルートから見たパスで依存関係をコピー
          mkdir -p ./frontend/.next/standalone/node_modules 
          cp -r ./frontend/node_modules/* ./frontend/.next/standalone/node_modules/

      # アーティファクトのアップロードステップ
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./frontend/.next 

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          
      # Azure Web Appへのデプロイ
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
