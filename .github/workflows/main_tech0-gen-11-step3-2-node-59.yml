name: Build and deploy Next.js app to Azure Web App - tech0-gen-11-step3-2-node-59

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tech0-gen-11-step3-2-node-59
  AZURE_WEBAPP_PACKAGE_PATH: '.'
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      # Node.js環境のセットアップ (キャッシュなし)
      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      # ★★★修正 1：npm install (working-directoryでパスを固定)★★★
      - name: npm install
        run: npm install
        working-directory: ./frontend 

      # ★★★修正 2：Next.jsのビルド (working-directoryでパスを固定)★★★
      - name: Next.js build (No Lint)
        run: npm run build || true 
        working-directory: ./frontend

      # ★★★修正 3：依存関係のコピー (working-directoryでパスを固定)★★★
      - name: Copy necessary dependencies to standalone directory
        run: |
          mkdir -p ./.next/standalone/node_modules 
          cp -r ./node_modules/* ./.next/standalone/node_modules/ || true
        working-directory: ./frontend 

      # アーティファクトのアップロードステップ
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./frontend/.next # ★★★アップロードパスを元の場所に戻す★★★

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          
      # Azure Web Appへのデプロイ
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
