name: Build and deploy Next.js app to Azure Web App - tech0-gen-11-step3-2-node-59

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tech0-gen-11-step3-2-node-59
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      # Node.js環境のセットアップ
      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      # npm install
      - name: npm install
        run: npm install
        working-directory: ./frontend 

      # Next.jsのビルド
      - name: Next.js build (No Lint)
        run: npm run build || true 
        working-directory: ./frontend

      # デプロイパッケージの作成（zip化）
      - name: Create Deployment Package
        run: |
          # frontend内の必要なファイルとフォルダをコピーし、zipに圧縮
          mkdir -p deploy_package
          cp -r ./frontend/.next ./deploy_package/
          cp -r ./frontend/node_modules ./deploy_package/
          cp ./frontend/package.json ./deploy_package/
          cp ./frontend/next.config.js ./deploy_package/
          
          # zipファイル作成
          cd deploy_package
          zip -r ../app.zip .
          cd ..
          
      # app.zipをアーティファクトとしてアップロード
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app-zip
          path: ./app.zip
          
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
      
    # ★★★究極の修正 1：デプロイジョブの環境変数としてPublish Profileを設定★★★
    env:
      AZURE_PUBLISH_PROFILE_SECRET: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

    steps:
      # zipファイルをダウンロード
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app-zip
          
      # zipファイルを展開
      - name: Unzip deployment package
        run: unzip app.zip

      # ★★★究極の修正 2：Azure Web Appへのデプロイ（環境変数をpublish-profileに渡す）★★★
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: . # 展開後のカレントディレクトリ（ルート）をパッケージとして指定
          publish-profile: ${{ env.AZURE_PUBLISH_PROFILE_SECRET }}
