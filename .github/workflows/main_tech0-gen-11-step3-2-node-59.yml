name: Build and deploy Next.js app to Azure Web App - tech0-gen-11-step3-2-node-59

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tech0-gen-11-step3-2-node-59
  AZURE_WEBAPP_PACKAGE_PATH: '.'
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      # Node.js環境のセットアップ (キャッシュなし)
      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      # ★★★修正 1：npm install の実行 (cdを強制)★★★
      - name: npm install
        run: cd ./frontend && npm install

      # ★★★修正 2：Next.jsのビルド (cdを強制し、ローカルで成功したコマンドに近い形)★★★
      - name: Next.js build (No Lint)
        # npm run build を使用し、ローカルで成功したビルドの再現を目指す
        run: cd ./frontend && npm run build || true 

      # ★★★修正 3：依存関係コピーのステップ (cdを強制)★★★
      - name: Copy necessary dependencies to standalone directory
        run: |
          # frontendディレクトリに移動し、ローカルで成功したビルドの出力パス (.next) を基準にコピー
          cd ./frontend 
          mkdir -p ./.next/standalone/node_modules 
          cp -r ./node_modules/* ./.next/standalone/node_modules/ || true 

      # アーティファクトのアップロードステップ
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./frontend/.next 

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          
      # Azure Web Appへのデプロイ
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
