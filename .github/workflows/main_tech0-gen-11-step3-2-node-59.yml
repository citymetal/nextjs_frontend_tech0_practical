jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      # Node.js環境のセットアップ (キャッシュなし)
      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      # npm install の実行 (リポジトリルートから実行)
      - name: npm install
        run: npm install --prefix ./frontend # ★npm installはprefixで実行

      # ★★★最終修正：Next.jsのビルドをfrontendディレクトリ内で確実に実行させる★★★
      - name: Next.js build (No Lint)
        run: cd ./frontend && next build --no-lint || true 

      # 依存関係コピーのステップ (runコマンドのみ)
      - name: Copy necessary dependencies to standalone directory
        run: |
          # ★★★パス修正：ルートからの相対パスでコピーを実行★★★
          mkdir -p ./frontend/.next/standalone/node_modules 
          cp -r ./frontend/node_modules/* ./frontend/.next/standalone/node_modules/ || true 

      # アーティファクトのアップロードステップ
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./frontend/.next # ★★★アップロードパスとビルド結果のパスを一致させる★★★
